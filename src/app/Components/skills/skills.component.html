<section id="habilidades" class="skills-section">
  <div class="container">
    <h2>Mis Habilidades</h2>
    <div class="skills-container">
      <div class="skills-category">
        <h3>Desarrollo Frontend</h3>
        <div class="skills-list">
          <div *ngFor="let skill of frontendSkills" class="skill-item">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="skills-category">
        <h3>Desarrollo Backend</h3>
        <div class="skills-list">
          <div *ngFor="let skill of backendSkills" class="skill-item">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="skills-category">
        <h3>Otras Habilidades</h3>
        <div class="skills-list">
          <div *ngFor="let skill of otherSkills" class="skill-item">
            <div class="skill-info">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
